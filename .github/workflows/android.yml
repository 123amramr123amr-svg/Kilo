name: Android CI

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Installs Gradle 8.9 directly, so no wrapper JAR has to be committed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain --stacktrace 2>&1 | tee assemble.log || touch assemble.failed

      - name: Unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --console=plain --stacktrace 2>&1 | tee unit-tests.log || touch tests.failed

      # Surfaces compiler/test failures as check annotations, which stay readable
      # even when the raw Actions log archive is not reachable.
      - name: Report failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re
          import xml.etree.ElementTree as ET

          blocks = []

          # 1. Compiler / Gradle errors from the console logs.
          for name in ("assemble.log", "unit-tests.log"):
              if not os.path.exists(name):
                  continue
              lines = open(name, errors="ignore").read().splitlines()
              picked = [l for l in lines if re.search(r"(^e: |error: |What went wrong|Execution failed|Could not resolve|Caused by: |FAILED$)", l)]
              if picked:
                  blocks.append(f"=== {name} ===\n" + "\n".join(picked[:120]))

          # 2. Failing unit tests, straight from the JUnit XML results.
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      message = (failure.get("message") or "").strip()[:500]
                      detail = (failure.text or "").strip()
                      detail = "\n".join(detail.splitlines()[:8])[:900]
                      blocks.append(
                          f"TEST FAILED {case.get('classname')}::{case.get('name')}\n{message}\n{detail}"
                      )

          if not blocks:
              blocks = ["Build reported a failure but no matching lines were found."]
          payload = "\n\n".join(blocks)[:60000]
          payload = payload.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=Build or test failure::{payload}")
          PY

      - name: Fail the job when the build failed
        if: always()
        run: |
          if [ -f assemble.failed ] || [ -f tests.failed ]; then
            echo "Gradle reported failures (see annotations)."
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
