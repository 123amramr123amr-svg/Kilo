<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mauns Web - وكيل الذكاء الاصطناعي</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Tahoma, Arial; margin: 0; background: #f5f5f5; color: #111; direction: rtl; }
.container { max-width: 720px; margin: 40px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
h1 { font-size: 1.5rem; margin: 0 0 8px; }
p.sub { color: #666; font-size: .95rem; margin: 0 0 20px; }
textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; font-family: inherit; resize: vertical; }
button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 12px; }
button:disabled { opacity: .6; cursor: not-allowed; }
pre.output { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; margin-top: 16px; max-height: 60vh; overflow: auto; }
.hidden { display: none; }
.muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Mauns Web</h1>
    <p class="sub">أدخل مهمتك وسيقوم الوكيل بتنفذها وإظهار النتيجة.</p>
    <textarea id="task" placeholder="مثال: أنشئ ملف Hello World واطبع محتواه"></textarea>
    <button id="btn">تنفيذ المهمة</button>
    <div id="error" class="muted hidden"></div>
    <pre id="out" class="output hidden"></pre>
  </div>
</div>
<script>
const btn = document.getElementById('btn');
const task = document.getElementById('task');
const out = document.getElementById('out');
const err = document.getElementById('error');
btn.onclick = async () => {
  const t = task.value.trim();
  if (!t) return;
  btn.disabled = true;
  out.classList.add('hidden');
  err.classList.add('hidden');
  out.textContent = '';
  try {
    const r = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task: t }) });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || 'خطأ غير معروف'; err.classList.remove('hidden'); }
    else { out.textContent = j.output || '(لا مخرجات)'; out.classList.remove('hidden'); }
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
