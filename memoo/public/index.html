<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoo - وكيل الذكاء الاصطناعي</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Tahoma, "Segoe UI Arabic", Arial; margin: 0; background: #f0f2f5; color: #111; direction: rtl; }
.container { max-width: 720px; margin: 40px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.badge { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 1.25rem; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
p.sub { color: #666; font-size: .95rem; margin: 0 0 20px; }
textarea { width: 100%; min-height: 140px; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; font-family: inherit; resize: vertical; outline: none; }
textarea:focus { border-color: #2563eb; }
button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 14px; }
button:disabled { opacity: .65; cursor: not-allowed; }
pre.output { background: #0f172a; color: #cbd5e1; padding: 16px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; margin-top: 16px; max-height: 70vh; overflow: auto; border: 1px solid #1e293b; }
.hidden { display: none; }
.muted { color: #666; font-size: .9rem; margin-top: 8px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <div class="badge">M</div>
      <div>
        <h1>Memoo</h1>
        <p class="sub">وكيل الذكاء الاصطناعي — أدخل مهمتك وسيقوم بتنفيذها وإظهار النتيجة.</p>
      </div>
    </div>
    <textarea id="task" placeholder="مثال: أنشئ ملف Hello World واطبع محتواه"></textarea>
    <button id="btn"><span id="spinner" class="spinner hidden"></span>تنفيذ المهمة</button>
    <div id="error" class="muted hidden"></div>
    <pre id="out" class="output hidden"></pre>
  </div>
</div>
<script>
const btn = document.getElementById('btn');
const spinner = document.getElementById('spinner');
const task = document.getElementById('task');
const out = document.getElementById('out');
const err = document.getElementById('error');
btn.onclick = async () => {
  const t = task.value.trim();
  if (!t) return;
  btn.disabled = true;
  spinner.classList.remove('hidden');
  out.classList.add('hidden');
  err.classList.add('hidden');
  out.textContent = '';
  try {
    const r = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task: t }) });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || 'خطأ غير معروف'; err.classList.remove('hidden'); }
    else { out.textContent = j.output || '(لا مخرجات)'; out.classList.remove('hidden'); }
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    spinner.classList.add('hidden');
  }
};
</script>
</body>
</html>
